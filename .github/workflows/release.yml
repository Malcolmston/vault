name: Release

on:
  push:
    tags: ["v*"]
  # Run the whole thing without publishing, to prove the pipeline works.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and check, but do not publish"
        type: boolean
        default: true

jobs:
  # A tag for a version the registry already has is a tag someone added after
  # the fact — when this repository was created, say. There is nothing to
  # publish, and failing would only cry wolf.
  decide:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - id: check
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if npm view "@mstone6969/vault@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${version} is already on npm; nothing to release."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: decide
    if: needs.decide.outputs.published != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # A tag that disagrees with package.json means someone tagged the wrong
      # commit; publishing it would put the wrong version on npm for good.
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(bun --print "require('./package.json').version")"
          echo "tag $tagged, package.json $declared"
          [ "$tagged" = "$declared" ] || {
            echo "::error::tag v$tagged does not match package.json $declared"
            exit 1
          }

      # The same gate prepublishOnly runs, spelled out so a failure names the
      # step that failed rather than one long script.
      - name: Types
        run: bun run typecheck
      - name: Documentation
        run: bun run docs:check
      - name: Tests and coverage
        run: bun run test:coverage
      - name: Build
        run: bun run build
      - name: Reference
        run: bun run docs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import from Node
        run: node -e "import('./dist/index.js').then(m => { if (!m.Vault) throw new Error('no Vault export') })"

      - name: Pack
        run: npm pack --dry-run

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          # prepublishOnly already ran above, step by step.
          npm publish --access public --ignore-scripts

  # The same artifact, published a second time to GitHub Packages.
  #
  # That registry insists a package's scope is the repository owner's, in
  # lowercase, so it goes out as @malcolmston/vault rather than the
  # @mstone6969/vault npmjs.com knows. Same code, same version, different name —
  # npmjs.com remains the one to depend on.
  github-packages:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.dry_run == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets GITHUB_TOKEN publish, so no personal access token is needed here.
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run docs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@malcolmston"

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Rename for this registry only; the working copy is thrown away with
          # the runner, so nothing about the npmjs.com package changes.
          node -e "
            const fs = require('fs')
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            pkg.name = '@malcolmston/vault'
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          "
          version="$(node -p "require('./package.json').version")"
          if npm view "@malcolmston/vault@${version}" version >/dev/null 2>&1; then
            echo "::notice::${version} is already on GitHub Packages; nothing to do."
            exit 0
          fi
          npm publish --ignore-scripts
